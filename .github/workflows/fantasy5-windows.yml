name: Fantasy 5 Windows portable build
on:
  push:
    branches: [main]
    paths: ['fantasy5/**', '.github/workflows/fantasy5-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Build and validate Fantasy 5 portable EXE
        shell: pwsh
        run: ./fantasy5/build_windows.ps1
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: Fantasy5-Windows-x64
          path: fantasy5/dist/Fantasy5_Windows_Portable.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fantasy5-Windows-validation
          path: |
            fantasy5/dist/*json
            fantasy5/dist/*txt
          if-no-files-found: ignore
